services:
  - type: web
    name: logger-crab
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      # Render Web Services internally bind to port 10000 — Render overrides
      # whatever PORT you set here, so the value below mirrors the Render
      # runtime rather than misleading future readers. Confirmed via the
      # Render dashboard's Internal Address (logger-crab:10000), 2026-05-08.
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: sqlite:///var/data/logs.db
      - key: HOT_STORE
        value: sqlite
      - key: COLD_STORE
        value: s3
      # Per-consumer named tokens are managed via the Render UI as
      # `INGEST_TOKEN_<NAME>=<tier>:<token>` rows (one per consumer).
      # Listing them here is intentionally avoided so adding/removing a
      # consumer is a UI-only change, not a render.yaml edit.
      - key: DASHBOARD_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_LOGS_BUCKET
        value: versable-logs
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ENABLE_ALERTS
        value: "false"
      - key: RUST_LOG
        value: info
    disk:
      name: logger-crab-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true
